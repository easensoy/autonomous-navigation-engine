# Parameters of the ane_navigation nodes for the warehouse trials. Every value here is also the
# default in the code, so this file documents the configuration the trials ran with.
graph_navigator:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    control_rate_hz: 20.0
    scan_pose_tolerance_s: 0.1     # a scan is mapped only with a pose this close to it in time
    # Mission executive
    association_radius_m: 0.20
    goal_tolerance_m: 0.10
    stop_arrival_radius_m: 0.06
    max_cross_track_m: 0.20
    progress_timeout_s: 4.0
    progress_distance_m: 0.05
    feedback_timeout_s: 0.25
    recovery_window_s: 4.0
    rejoin_radius_m: 0.15
    turn_threshold_rad: 0.1745
    # Segment controller
    max_linear_mps: 0.5
    max_angular_radps: 1.0
    max_linear_accel_mps2: 0.5
    max_linear_decel_mps2: 1.0
    max_angular_accel_radps2: 2.0
    lookahead_m: 0.40
    rotate_enter_rad: 0.30
    rotate_exit_rad: 0.04
    rotate_gain: 1.5
    min_rotate_rate_radps: 0.15
    creep_speed_mps: 0.04
    stop_tolerance_m: 0.04
    # Blockage mapper
    blocking_radius_m: 0.55
    static_tolerance_m: 0.10
    min_points: 3
    consecutive_scans: 2
    # Footprint contract, checked against the roadmap at start-up
    footprint_length_m: 0.40
    footprint_width_m: 0.37
    clearance_margin_m: 0.10

cmd_vel_gate:
  ros__parameters:
    rate_hz: 20.0
    input_timeout_s: 0.3
    max_linear_mps: 0.6
    max_angular_radps: 1.5
